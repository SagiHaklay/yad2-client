<div class="desktop-mode">
    <form class="desktop-form" action="">
        <input class="location-input" type="text" placeholder="איזור, עיר שכונה או רחוב" />
        <div class="seperator"></div>
        <div class="form-section">
            <button class="toggle-btn" type="button">
                <span>השכרה</span>
                @if (false) {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                } @else {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                }
                
            </button>
            @if (false) {
                <div class="form-card">
                    <div class="transaction-select">
                        <a href="">
                            <span>מכירה</span>
                        </a>
                        <a class="selected" href="">
                            <span>השכרה</span>
                            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.938 5.492a.75.75 0 011.172.929l-.069.087L9.804 18.724a1.752 1.752 0 01-2.565.012l-.104-.122-4.727-6.068a.75.75 0 011.11-1.004l.074.082 4.727 6.069a.25.25 0 00.35.043l.031-.028L19.938 5.492z" fill="currentColor"></path></svg>
                        </a>
                    </div>
                </div>
            }
            
        </div>
        <div class="form-section">
            <button class="toggle-btn" type="button">
                <span>סוג הנכס</span>
                @if (false) {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                } @else {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                }
            </button>
            @if (false) {
                <div class="form-card">
                    <app-property-type-filter></app-property-type-filter>
                </div>
            }
        </div>
        
        <div class="form-section">
            <button class="toggle-btn" type="button">
                <span>מחיר</span>
                @if (false) {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                } @else {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                }
            </button>
            @if (false) {
                <div class="form-card">
                    <app-range-slider 
                        class="price-range" 
                        [isCurrency]="true" 
                        [minNumberValue]="0"
                        [maxNumberValue]="20000"
                        [step]="1000"
                        [rangeForm]="priceRange"
                    ></app-range-slider>
                </div>
            }
        </div>
        <div class="form-section">
            <button class="toggle-btn" type="button">
                <span>חדרים</span>
                @if (false) {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                } @else {
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                }
            </button>
            @if (false) {
                <div class="form-card">
                    <app-room-count-select></app-room-count-select>
                </div>
            }
        </div>
        <button class="toggle-btn" type="button">
            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.72973 7.19595H13.8034C14.1211 6.07289 15.1536 5.25 16.3784 5.25C17.6031 5.25 18.6357 6.07289 18.9533 7.19595H20.2703C20.6733 7.19595 21 7.52266 21 7.92568C21 8.32869 20.6733 8.65541 20.2703 8.65541H18.9533C18.6357 9.77846 17.6031 10.6014 16.3784 10.6014C15.1536 10.6014 14.1211 9.77846 13.8034 8.65541H3.72973C3.32671 8.65541 3 8.32869 3 7.92568C3 7.52266 3.32671 7.19595 3.72973 7.19595ZM16.3784 6.70946C15.7067 6.70946 15.1622 7.25398 15.1622 7.92568C15.1622 8.59737 15.7067 9.14189 16.3784 9.14189C17.0501 9.14189 17.5946 8.59737 17.5946 7.92568C17.5946 7.25398 17.0501 6.70946 16.3784 6.70946Z" fill="currentColor"></path><path fill-rule="evenodd" clip-rule="evenodd" d="M3.72973 14.9797C3.32671 14.9797 3 15.3064 3 15.7095C3 16.1125 3.32671 16.4392 3.72973 16.4392H6.01964C6.33728 17.5622 7.36984 18.3851 8.59459 18.3851C9.81935 18.3851 10.8519 17.5622 11.1696 16.4392H20.2703C20.6733 16.4392 21 16.1125 21 15.7095C21 15.3064 20.6733 14.9797 20.2703 14.9797H11.1696C10.8519 13.8567 9.81935 13.0338 8.59459 13.0338C7.36984 13.0338 6.33728 13.8567 6.01964 14.9797H3.72973ZM9.81081 15.7095C9.81081 15.0378 9.26629 14.4932 8.59459 14.4932C7.9229 14.4932 7.37838 15.0378 7.37838 15.7095C7.37838 16.3812 7.9229 16.9257 8.59459 16.9257C9.26629 16.9257 9.81081 16.3812 9.81081 15.7095Z" fill="currentColor"></path></svg>
            <span>סינונים נוספים</span>
        </button>
        <button class="search-btn" type="submit">
            חיפוש
        </button>
        <button class="notification-btn" type="button">
            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="create-alert-button_alertInactiveIcon__V557R"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.55 15.542c.043-.14.086-.298.128-.475a2.223 2.223 0 001.473.428 9.46 9.46 0 01-.2.694h10.04l-.009-.027c-.29-.898-.555-2.377-.555-4.81a4.28 4.28 0 00-1.297-3.06A4.479 4.479 0 0012 7.023c-.49 0-.97.079-1.425.23a1.533 1.533 0 01-1.281-1.095 6.059 6.059 0 011.842-.574V4.75c0-.414.344-.75.767-.75.424 0 .767.336.767.75v.81a6.016 6.016 0 013.545 1.67 5.764 5.764 0 011.746 4.122c0 2.339.255 3.653.484 4.356.113.35.217.54.274.629.02.03.034.048.04.056a.738.738 0 01.197.795.766.766 0 01-.723.5h-3.31a.731.731 0 01-.03.197 2.944 2.944 0 01-1.083 1.527 3.05 3.05 0 01-1.803.588 3.05 3.05 0 01-1.802-.588c-.52-.381-.9-.917-1.083-1.527a.736.736 0 01-.031-.196H5.767a.769.769 0 01-.69-.422.736.736 0 01.087-.793c.015-.023.043-.07.08-.143.076-.146.19-.4.307-.79zm5.133 2.147c.103.205.254.385.442.523a1.493 1.493 0 001.764 0c.189-.138.34-.318.442-.523h-2.648zM7 13.5a.75.75 0 01-.75-.75v-2h-2a.75.75 0 010-1.5h2v-2a.75.75 0 011.5 0v2h2a.75.75 0 010 1.5h-2v2a.75.75 0 01-.75.75z" fill="currentColor"></path></svg>
            <span>יצירת התראה</span>
        </button>
        
    </form>
</div>
@if (false) {
    <div class="modal-container desktop-mode">
        <div class="modal">
            <div class="modal-header">
                <span class="title">
                    סינונים נוספים
                </span>
                <button class="close-btn" type="button">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.935 5.278a.75.75 0 01.085.982l-.066.078-4.903 5.077 5.146 5.328.066.078a.75.75 0 01-1.145.964l-5.11-5.29-5.109 5.29a.75.75 0 01-1.144-.964l.065-.078 5.146-5.328-4.903-5.077-.065-.078a.75.75 0 011.144-.964l4.866 5.04 4.867-5.04a.75.75 0 011.06-.018z" fill="currentColor"></path></svg>
                </button>
            </div>
            <div class="modal-content">
                <app-additional-filters [filterFormGroup]="searchForm"></app-additional-filters>
            </div>
            <div class="modal-footer">
                <button class="reset-btn" type="reset">
                    איפוס
                </button>
                <button class="confirm-btn" type="button">
                    אישור
                </button>
            </div>
        </div>
    </div>
}

        <button type="button">

@if (true) {
    <form class="mobile-form mobile-mode">
        <div class="header">
            <span>חיפוש נדל"ן</span>
            <button class="close-btn" type="button">
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.935 5.278a.75.75 0 01.085.982l-.066.078-4.903 5.077 5.146 5.328.066.078a.75.75 0 01-1.145.964l-5.11-5.29-5.109 5.29a.75.75 0 01-1.144-.964l.065-.078 5.146-5.328-4.903-5.077-.065-.078a.75.75 0 011.144-.964l4.866 5.04 4.867-5.04a.75.75 0 011.06-.018z" fill="currentColor"></path></svg>
            </button>
        </div>
        <div class="form-content">
            <div class="form-section">
                <strong class="title">
                    מיקום
                </strong>
                <input class="location-input" type="text" placeholder="איזור, עיר שכונה או רחוב" />
            </div>
            <div class="form-section">
                <strong class="title">
                    סוג עסקה
                </strong>
                <div class="transaction-links">
                    <a >מכירה</a>
                    <a >השכרה</a>
                </div>
            </div>
            <div class="form-section">
                <strong class="title">
                    סוג הנכס
                </strong>
                <button class="dropdown-btn" type="button">
                    <span>
                        סוג הנכס
                    </span>
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="dropdown-icon"><path d="M17.695 8.675a.75.75 0 011.13.98l-.073.085-6.18 6.136a.75.75 0 01-.976.07l-.084-.074L5.41 9.727a.75.75 0 01.98-1.13l.084.074 5.574 5.612 5.647-5.608z" fill="currentColor"></path></svg>
                </button>
            </div>
            <div class="form-section">
                <strong class="title">
                    מחיר
                </strong>
                <app-range-slider 
                    class="price-range" 
                    [isCurrency]="true" 
                    [minNumberValue]="0"
                    [maxNumberValue]="20000"
                    [step]="1000"
                ></app-range-slider>
            </div>
            <div class="form-section">
                <strong class="title">
                    חדרים
                </strong>
                <app-room-count-select></app-room-count-select>
            </div>
            <app-additional-filters></app-additional-filters>
        </div>
        <div class="form-footer">
            <button class="search-btn" type="submit">
                חיפוש
            </button>
        </div>
    </form>
}
